<!-- Clawd, the Claude Code mascot, as the CLI draws it from quarter-blocks:
       ▐▛███▜▌
      ▝▜█████▛▘
        ▘▘ ▝▝
     One terminal quarter-cell is twice as tall as wide, so a "pixel" here is 1x2.
     18 columns x 5 rows = 18x10, centred in an 18x16 box; same orange on light and dark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="16" viewBox="0 0 18 16" shape-rendering="crispEdges">
  <g fill="#D77757">
    <rect x="3" y="3" width="12" height="2"/>
    <rect x="3" y="5" width="2" height="2"/>
    <rect x="6" y="5" width="6" height="2"/>
    <rect x="13" y="5" width="2" height="2"/>
    <rect x="1" y="7" width="16" height="2"/>
    <rect x="3" y="9" width="12" height="2"/>
    <rect x="4" y="11" width="1" height="2"/>
    <rect x="6" y="11" width="1" height="2"/>
    <rect x="11" y="11" width="1" height="2"/>
    <rect x="13" y="11" width="1" height="2"/>
  </g>
</svg>
